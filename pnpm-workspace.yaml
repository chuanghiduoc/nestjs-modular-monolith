allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.2

# One fastify for the whole tree. @nestjs/platform-fastify pins its own copy,
# and two copies make FastifyInstance structurally incompatible with itself —
# the plugin decorations land on one of them and the types on the other.
overrides:
  fastify: 5.12.0
  deepmerge-ts: 8.0.2
  bullmq>ioredis: 5.10.1
  # The prisma CLI depends on mysql2 at an exact 3.15.3, and every version up to
  # and including 3.23.0 carries GHSA-rgwj-5xj2-c3m3 — a decompression bomb that
  # osv-scanner fails the build on. Nothing here ever opens a mysql connection,
  # so the override is only to keep a driver we never load out of the advisory
  # report. Drop it once the prisma CLI ships a patched mysql2 itself.
  mysql2: 3.24.2
