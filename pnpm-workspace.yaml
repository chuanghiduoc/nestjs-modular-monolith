allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  prisma: true
  protobufjs: false
  ssh2: false

minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.2

# One fastify for the whole tree. @nestjs/platform-fastify pins its own copy,
# and two copies make FastifyInstance structurally incompatible with itself —
# the plugin decorations land on one of them and the types on the other.
overrides:
  fastify: 5.12.0
  deepmerge-ts: 8.0.2
  bullmq>ioredis: 5.10.1
