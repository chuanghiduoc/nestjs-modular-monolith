pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: '*.{ts,js,cjs,mjs,json,jsonc,yml,yaml,md}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob: '*.{ts,js,cjs,mjs}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
